<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Thaksh International School - Student View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .hidden { display: none !important; }
    </style>
    <!-- PWA & Android Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <!-- iOS (Safari) Native App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agenda Portal">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Agenda Service Worker registered:', reg.scope))
            .catch((err) => console.error('Service Worker registration failed:', err));
        });
      }
    </script>


        <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      
      <!-- Force browsers to check GitHub for updates every time -->
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
      <meta http-equiv="Pragma" content="no-cache">
      <meta http-equiv="Expires" content="0">
      
      <title>Agenda</title>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Aditya Thaksh International School</h1>
        <p class="text-xs text-indigo-200">Agenda</p>
      </div>
      <nav class="flex gap-2">
        <a href="index.html" class="px-3 py-1.5 rounded-md bg-white text-indigo-900 font-medium text-xs shadow">Parent Portal</a>
        <a href="teacher.html" class="px-3 py-1.5 rounded-md bg-indigo-800 text-indigo-200 hover:text-white font-medium text-xs transition-all">Teacher Login</a>
        <a href="principal.html" class="px-3 py-1.5 rounded-md bg-indigo-800 text-indigo-200 hover:text-white font-medium text-xs transition-all">Principal Login</a>
      </nav>
    </div>
  </header>
 <main class="max-w-5xl mx-auto px-4 py-8">
    <!-- INNOVATIVE MODAL NOTIFICATION CONTAINER (REPLACING OLD BROWSER ALERTS) -->
    <div id="innovativeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-300 border border-gray-100" id="modalBox">
            <div id="modalIconContainer" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-md bg-amber-100 text-amber-600">
                ⚠️
            </div>
            <h3 id="modalTitle" class="text-xl font-extrabold text-blue-900 mb-2">Attention Required</h3>
            <p id="modalMessage" class="text-sm text-gray-600 leading-relaxed mb-6 font-medium">Please verify your inputs before proceeding.</p>
            <button onclick="closeModal()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-2xl shadow-lg transition-all transform active:scale-95">
                Got it, Thanks
            </button>
        </div>
    </div>

    <!-- MODERN TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <div class="max-w-4xl w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100 mb-6">
        <div class="text-center mb-6">

            <h2 class="text-sm font-semibold text-gray-500 tracking-wider uppercase mt-1">Student & Parent Daily Agenda Portal</h2>
        </div>

        <!-- Filter Controls -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-2xl border">
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Select Date</label>
                <input type="date" id="studentDateSearch" class="w-full border rounded-2xl p-3 bg-white font-medium">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Grade</label>
                <select id="studentGradeSelect" class="w-full border rounded-2xl p-3 bg-white font-medium">
                    <option value="">-- Select Grade --</option>
                    <option value="Nursery">Nursery</option><option value="LKG">LKG</option><option value="UKG">UKG</option>
                    <option value="Grade 1">Grade 1</option><option value="Grade 2">Grade 2</option><option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option><option value="Grade 5">Grade 5</option><option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option><option value="Grade 8">Grade 8</option><option value="Grade 9">Grade 9</option>
                    <option value="Grade X">Grade X</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Section</label>
                <select id="studentSectionSelect" class="w-full border rounded-2xl p-3 bg-white font-medium">
                    <option value="">-- Select Section --</option>
                    <option value="Orchid">Orchid</option>
                    <option value="Tulip">Tulip</option>
                    <option value="Daffodil">Daffodil</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Agenda Display Card -->
    <div class="max-w-4xl w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100 hidden" id="agendaDisplayContainer">
        <div class="flex justify-between items-center pb-4 mb-4 border-b">
            <div>
                <h3 class="text-xl font-extrabold text-blue-900" id="displayTitle">Daily Class Agenda</h3>
            </div>
            <button id="studentCopyBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow">
                Copy to Clipboard
            </button>
        </div>
        <textarea id="studentOutputText" readonly class="w-full h-[500px] p-4 border rounded-2xl bg-gray-50 font-mono text-sm leading-relaxed resize-none"></textarea>
    </div>

    <!-- Empty / Locked State Container -->
    <div id="studentMessageCard" class="max-w-4xl w-full bg-white p-12 rounded-3xl shadow-xl border border-gray-100 text-center text-gray-400 italic">
        Please select a Date, Grade, and Section to load the verified agenda.
    </div>
</main>
    <!-- SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhPccMlDJMyFnen-c8qpTSopHtFAn8iYA",
            authDomain: "agenda-c8af3.firebaseapp.com",
            projectId: "agenda-c8af3",
            storageBucket: "agenda-c8af3.firebasestorage.app",
            messagingSenderId: "598103460045",
            appId: "1:598103460045:web:58000b589b8a514c258184",
            measurementId: "G-6KJ0C8QKC8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('studentDateSearch').valueAsDate = new Date();

        // INNOVATIVE MODAL FUNCTION (Replaces alert boxes)
        window.showModal = function(title, message, type = "warning") {
            const modal = document.getElementById("innovativeModal");
            const modalBox = document.getElementById("modalBox");
            const modalTitle = document.getElementById("modalTitle");
            const modalMessage = document.getElementById("modalMessage");
            const modalIcon = document.getElementById("modalIconContainer");

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === "success") {
                modalIcon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-md bg-green-100 text-green-600";
                modalIcon.innerText = "✨";
            } else if (type === "error") {
                modalIcon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-md bg-red-100 text-red-600";
                modalIcon.innerText = "🛑";
            } else {
                modalIcon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-md bg-amber-100 text-amber-600";
                modalIcon.innerText = "⚠️";
            }

            modal.classList.remove("hidden");
            setTimeout(() => modalBox.classList.remove("scale-95"), 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById("innovativeModal");
            const modalBox = document.getElementById("modalBox");
            modalBox.classList.add("scale-95");
            setTimeout(() => modal.classList.add("hidden"), 200);
        }

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-green-600" : "bg-red-600";
            toast.className = `${bgColor} text-white px-6 py-4 rounded-2xl shadow-2xl transform transition-all duration-300 translate-y-10 opacity-0 font-bold flex items-center border border-white/20`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove("translate-y-10", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-10");
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function loadAgenda() {
            const dateVal = document.getElementById('studentDateSearch').value;
            const grade = document.getElementById('studentGradeSelect').value;
            const section = document.getElementById('studentSectionSelect').value;
            const displayContainer = document.getElementById('agendaDisplayContainer');
            const messageCard = document.getElementById('studentMessageCard');

            if (!dateVal || !grade || !section) {
                showModal("Missing Information", "Please select a Date, Grade, and Section to view the agenda.", "warning");
                return;
            }

            const docId = `${dateVal}_${grade}_${section}`;
            messageCard.classList.remove('hidden');
            messageCard.innerHTML = `<span class="animate-pulse text-gray-500 font-semibold">Checking database for approved report...</span>`;
            displayContainer.classList.add('hidden');

            try {
                const docSnap = await getDoc(doc(db, "daily_reports", docId));
                if (docSnap.exists()) {
                    const data = docSnap.data();

                    if (data.status === "Approved") {
                        let out = "Namaste parents,\n";
                        const [year, month, day] = data.date.split('-');
                        out += `${day}/${month}/${year}\n`;
                        out += `Grade - ${data.grade} ${data.section}\n\n`;

                        if (data.assemblyInfo) out += `🙏🏻🙏🏻 ${data.assemblyInfo} \n\n`;
                        if (data.zSubj || data.zDesc) {
                            out += `📔 Zero Period\n`;
                            if (data.zSubj) out += `${data.zSubj} `;
                            if (data.zDesc) { if (data.zSubj) out += `- `; out += `${data.zDesc}`; }
                            out += `\n\n`;
                        }

                        for (let i = 1; i <= 8; i++) {
                            const subj = data[`s${i}Subj`];
                            const desc = data[`s${i}Desc`];
                            if (subj || desc) {
                                out += `📔Session- ${i}\n`;
                                if (subj) out += `${subj}:\n`;
                                if (desc) out += `${desc}\n`;
                                out += `\n\n`;
                            }
                            if (i === 2) out += `Fruit Break\n🍏🍐🍊🍋🍋‍🟩🍌🍉🍇🍓\n\n`;
                            if (i === 4) out += `Lunch Break\n\n🥚🍳🥞🥙🌮🥗🥞🍱\n\n`;
                            if (i === 6) out += `Snacks break \n🥯🥫🍬🌭🍕🍫🍟🍭\n\n`;
                        }

                        if (data.refName || data.refDesc) {
                            out += `🤗 Reflection by ${data.refName || '[Name]'}\n`;
                            if (data.refDesc) out += `${data.refDesc}\n\n`;
                        }

                        if (data.homeworkDetails) {
                            out += `📚 Homework Details\n`;
                            out += `${data.homeworkDetails}\n`;
                        }

                        document.getElementById('studentOutputText').value = out.trim();
                        document.getElementById('displayTitle').innerText = `${data.grade} ${data.section} Daily Agenda`;
                        
                        messageCard.classList.add('hidden');
                        displayContainer.classList.remove('hidden');
                    } else {
                        messageCard.innerHTML = `<span class="text-amber-600 font-bold">⏳ This report has been submitted by the teacher but is currently pending Principal approval. Please check back later!</span>`;
                    }
                } else {
                    messageCard.innerHTML = `<span class="text-red-500 font-bold">❌ No agenda report has been submitted for ${grade} ${section} on this date.</span>`;
                }
            } catch (err) {
                console.error(err);
                messageCard.innerHTML = `<span class="text-red-500 font-bold">Error loading record from database.</span>`;
            }
        }

        // Trigger loadAgenda automatically when the Section dropdown value changes
        document.getElementById('studentSectionSelect').addEventListener('change', () => {
            if (document.getElementById('studentSectionSelect').value) {
                loadAgenda();
            }
        });

        document.getElementById('studentCopyBtn').addEventListener('click', function() {
            const textarea = document.getElementById('studentOutputText');
            textarea.select();
            document.execCommand('copy');
            showToast("Agenda copied to clipboard!", "success");
        });
    </script>
</body>
</html>
